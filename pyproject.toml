[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flossware-ensemble"
version = "0.1"
description = "Standalone REST-first memory, knowledge, and retrieval platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ensemble*"]
