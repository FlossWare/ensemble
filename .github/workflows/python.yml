name: Python

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,poc-learning]'
      - name: Validate installer shell syntax
        run: |
          for script in scripts/install.sh scripts/backup-persistence.sh scripts/restore-persistence.sh; do
            bash -n "$script"
          done
      - name: Validate Control Center JavaScript
        run: node --check ensemble/control.js
      - name: Audit POC dependency retention
        run: python -m parity.dependency_audit
      - name: Smoke-test judged retrieval evaluator
        run: python -m parity.retrieval_metrics parity/corpora/synthetic-smoke.json --report /tmp/retrieval-parity-report.json
      - name: Test parity harness
        run: python -m pytest tests/test_parity_harness.py
      - name: Test
        run: python -m pytest
